name: Validate Platform CI

on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: platform-ci-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflows
        run: actionlint
      - name: Validate shell helper syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find scripts -type f -name '*.sh' -print0)
          for script in "${scripts[@]}"; do
            echo "bash -n $script"
            bash -n "$script"
          done

  smoke-detect:
    name: Reusable detect smoke test
    uses: ./.github/workflows/reusable-detect.yml
    with:
      runner_json: '"ubuntu-latest"'

  smoke-runner-policy:
    name: Reusable runner policy smoke test
    uses: ./.github/workflows/reusable-runner-policy.yml
    with:
      runner_json: '"ubuntu-latest"'
      allow_regex: '^\.github/workflows/'
